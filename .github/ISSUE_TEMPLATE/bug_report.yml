name: Bug report
description: Something in @wideset/react does not work as documented.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Package version
      description: Output of `npm ls @wideset/react`, or the CLI if you copied the component.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: React version, bundler or framework (Vite, Next.js…), browser.
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Component
      placeholder: Select
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: reproduction
    attributes:
      label: Reproduction
      description: A StackBlitz or CodeSandbox link, or a minimal repository.
