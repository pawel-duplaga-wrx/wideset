<!doctype html>
<!--
  Served by Cloudflare Pages, with status 404, for any path that does not exist. Without this file
  Pages treats the site as a single-page app and answers every unknown URL with Storybook's
  index.html and status 200.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found · Wideset</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f5f5;
        --card: #ffffff;
        --text: #1a1a1a;
        --muted: #6e6e6e;
        --border: rgba(0, 0, 0, 0.12);
        --brand: #4e3ee0;
        --brand-hover: #331d9b;
        --on-brand: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141414;
          --card: #292929;
          --text: #ededed;
          --muted: #adadad;
          --border: rgba(255, 255, 255, 0.12);
          --brand: #7d70f1;
          --brand-hover: #9f96ff;
          --on-brand: #ffffff;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        color: var(--text);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 28rem;
        padding: 2.5rem 2rem;
        text-align: center;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 1rem;
      }
      .code {
        margin: 0 0 0.5rem;
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
        font-weight: 600;
        line-height: 1.3;
      }
      p {
        margin: 0 0 1.75rem;
        line-height: 1.55;
        color: var(--muted);
      }
      a.button {
        display: inline-block;
        padding: 0.625rem 1.25rem;
        font-weight: 600;
        text-decoration: none;
        color: var(--on-brand);
        background: var(--brand);
        border-radius: 0.5rem;
        transition: background-color 75ms;
      }
      a.button:hover {
        background: var(--brand-hover);
      }
a.button:focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">Error 404</p>
      <h1>This page doesn't exist</h1>
      <p>
        The link may be outdated, or the address may have a typo. Start again from the documentation.
      </p>
      <!-- Placeholder: the documentation site does not exist yet. Point this at it when it does. -->
      <a class="button" href="/docs">Go to the documentation</a>
    </main>
  </body>
</html>
